name: Bug report
description: Something in the demo behaved incorrectly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. The most useful bug reports say what you did,
        what you expected, and what happened instead — in that order.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in your own words.
      placeholder: I changed a task's duration and the dates downstream didn't move.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can I reproduce it?
      description: The exact clicks, as best you remember them.
      placeholder: |
        1. Open the Schedule tab
        2. Click the duration cell on task 12
        3. Type 8 and press Enter
        4. Task 13 stays where it was
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where in the demo?
      options:
        - Schedule / Gantt
        - Chat assistant
        - Portfolio or program rollups
        - Status and health
        - OKRs
        - Baselines
        - Somewhere else / not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 129 on macOS 15
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else
      description: Drag an image straight into this box if you have one.
    validations:
      required: false
